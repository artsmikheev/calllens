<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Кабинет — CallLens</title><style>body{font-family:Inter,system-ui,sans-serif;background:#f3f4ef;color:#17211b;margin:0}.wrap{max-width:760px;margin:10vh auto;padding:24px}.card{background:white;padding:32px;border:1px solid #dde4da;border-radius:18px;box-shadow:0 18px 50px #17211b18}button{padding:11px 18px;border:0;border-radius:9px;background:#1d6b4b;color:#fff;font-weight:700;cursor:pointer}.muted{color:#667268}</style></head><body><main class="wrap"><div class="card"><p>CALLLENS / APP</p><h1 id="welcome">Загрузка профиля…</h1><p id="tenant" class="muted"></p><button id="logout">Выйти</button></div></main><script>(async()=>{const res=await fetch('/api/auth/me');if(!res.ok){location.href='/login';return}const d=await res.json();document.querySelector('#welcome').textContent=`Добро пожаловать, ${d.user.full_name||d.user.email}`;document.querySelector('#tenant').textContent=`Тенант: ${d.tenant.name} · роль: ${d.user.role}`})();document.querySelector('#logout').onclick=async()=>{await fetch('/api/auth/logout',{method:'POST'});location.href='/login'};</script></body></html>
