<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Вход — CallLens</title><style>body{font-family:Inter,system-ui,sans-serif;background:#f3f4ef;color:#17211b;display:grid;place-items:center;min-height:100vh;margin:0}.card{background:white;padding:32px;max-width:420px;width:calc(100% - 40px);box-shadow:0 18px 50px #17211b18;border:1px solid #dde4da;border-radius:18px}h1{margin-top:0}label{display:block;font-weight:700;margin:16px 0 6px}input,button{width:100%;box-sizing:border-box;padding:12px;border:1px solid #cbd5c9;border-radius:10px;font-size:16px}button{margin-top:18px;background:#1d6b4b;color:#fff;border:0;font-weight:700;cursor:pointer}.hint{color:#667268;font-size:13px;line-height:1.5}.status{margin-top:16px;min-height:20px;color:#1d6b4b}</style></head>
<body><main class="card"><p>CALLLENS / AUTH</p><h1>Войти в CallLens</h1><p class="hint">Введите рабочий email. Мы отправим одноразовую ссылку без пароля.</p><form id="login"><label for="email">Email</label><input id="email" type="email" required autocomplete="email" placeholder="you@company.com"><label for="tenant">Тенант <span class="hint">(необязательно)</span></label><input id="tenant" type="text" autocomplete="organization" placeholder="pilot"><button>Получить ссылку</button></form><p id="status" class="status" role="status"></p><p class="hint">В dev-режиме ссылка выводится в лог backend.</p></main><script>document.querySelector('#login').addEventListener('submit',async e=>{e.preventDefault();const status=document.querySelector('#status');status.textContent='Отправляем…';const res=await fetch('/api/auth/request-link',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.querySelector('#email').value,tenant_slug:document.querySelector('#tenant').value||null})});status.textContent=res.ok?'Если такой email есть в системе, ссылка отправлена.':'Не удалось обработать запрос.';});</script></body></html>
